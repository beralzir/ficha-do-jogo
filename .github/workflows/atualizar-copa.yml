name: atualizar-copa

# Hands-off: 1x/dia, busca placares novos de GRUPO e de MATA-MATA (football-data + ESPN, com quorum),
# e SÓ quando entra jogo novo SEM divergência: re-simula, rebuilda, passa no gate e publica.
# Mata-mata (decisão Bera 2026-06-30): auto — placar no fim da prorrogação (pênaltis não somam),
# winner do football-data confirmado pelo ESPN. Sem jogo novo -> não republica. Divergência/gate
# reprovado -> NÃO publica e o GitHub te manda e-mail (falha do workflow). Sucesso -> silencioso (Summary).

on:
  schedule:
    - cron: "17 12 * * *"    # 1x/dia às 12:17 UTC (09:17 BRT), após os jogos da véspera fecharem. Só publica se houver jogo novo.
  workflow_dispatch:           # botão "Run workflow" — teste manual / deploy forçado.
    inputs:
      force_deploy:
        description: "Forçar rebuild+deploy mesmo sem jogo novo (ex.: correção de código). Pula a ingestão."
        type: boolean
        default: false

concurrency:
  group: atualizar-copa
  cancel-in-progress: false    # nunca cortar um run no meio de publicar

permissions:
  contents: write              # commitar estado/saída de volta (trilha de auditoria)

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight (janela da Copa + secrets configurados)
        id: pre
        env:
          FD: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          today=$(date -u +%F)
          if [[ "$today" > "2026-07-20" ]]; then
            echo "Fora da janela da Copa ($today) — encerrando sem fazer nada."
            echo "run=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ -z "$FD" || -z "$CF" ]]; then
            echo "Secrets ainda não configurados (FOOTBALL_DATA_TOKEN/CLOUDFLARE_API_TOKEN)."
            echo "Pulando sem erro — veja docs/automacao-setup.md. (Sem spam de e-mail até configurar.)"
            echo "run=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=1" >> "$GITHUB_OUTPUT"

      - name: Ingestão (API + gates) — promove se houver jogo novo
        if: steps.pre.outputs.run == '1' && github.event.inputs.force_deploy != 'true'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          # exit 0 = ok/nada-novo/promovido · exit 2 = abort (nome desconhecido/rede) ·
          # exit 3 = bloqueado (divergência de fonte / sobrescrita) -> falha -> e-mail do GitHub.
          python3 src/ingest.py --promote

      - name: Mudou o estado? (decide se re-publica)
        if: steps.pre.outputs.run == '1'
        id: ch
        run: |
          if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "Deploy forçado (workflow_dispatch) — republicando do código atual."
            echo "changed=1" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- data/live/state.json; then
            echo "Nenhum jogo novo — nada a republicar."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh das datas do mata-mata (ko_schedule)
        if: steps.ch.outputs.changed == '1' && github.event.inputs.force_deploy != 'true'
        continue-on-error: true   # datas do KO são secundárias — nunca bloqueiam a publicação do resultado
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          # Atualiza data/ko_schedule.json com as datas dos confrontos que a chave já revelou (R16+),
          # p/ os cards do mata-mata mostrarem dia/hora conforme avança. Fonte validada na FIFA.
          python3 scripts/fetch_wc_matches.py > /tmp/wc_matches.json
          python3 scripts/build_ko_schedule.py /tmp/wc_matches.json "$(date -u +%F)"

      - name: Re-simular + modelos + build + GATE de saída
        if: steps.ch.outputs.changed == '1'
        run: |
          chmod +x atualizar.sh
          ./atualizar.sh            # passos 1-4 (motor, modelos, build, invariantes/zero-dep).
          #                           SEM --deploy: para antes de publicar e FALHA se o gate reprovar.

      - name: Publicar (Cloudflare)
        if: steps.ch.outputs.changed == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.99.0"   # 4.x: a v3 default (3.90) rejeita static-assets em rota com path
          command: deploy

      - name: Commit de volta (estado + saída = trilha de auditoria)
        if: steps.ch.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist   # SÓ a trilha de auditoria — nunca node_modules/ etc. que a action instala no workspace
          git commit -m "auto: atualização Copa ($(date -u +%F))" || echo "nada a commitar"
          git push

      - name: Resumo do run
        if: steps.ch.outputs.changed == '1'
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('data/live/state.json')).get('results',{}).get('group',[]) or []))")
          nk=$(python3 -c "import json;print(len(json.load(open('data/live/state.json')).get('results',{}).get('knockout',[]) or []))")
          asof=$(python3 -c "import json;print(json.load(open('data/live/state.json')).get('as_of'))")
          echo "## Atualização publicada ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Data (UTC): $(date -u +'%F %H:%M')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jogos de grupo no estado: **$n**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jogos de mata-mata no estado: **$nk**" >> "$GITHUB_STEP_SUMMARY"
          echo "- as_of: $asof" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --pretty="- commit: %h %s" >> "$GITHUB_STEP_SUMMARY"
